name: Test 

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hung test fails the job, not after GitHub's 6 hours (#428)
    # Two halves on two runners, like test-mariadb (#603): after that split this was the slowest job. Each runner has its
    # own workspace, so its own database/database.sqlite.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Create Database
        run: touch database/database.sqlite

      # The schema is loaded from database/schema/sqlite-schema.sql by the sqlite3 client (the migrations squashed).
      - name: SQLite client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends sqlite3
      
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
        
      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Build Assets
        run: |
          npm install
          npm run build

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        # ParaTest's sequential split, as in test-mariadb. One database per process (CLAUDE.md, «Tests»).
        run: php artisan test --parallel --shard=${{ matrix.shard }}/2

  test-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hung test fails the job, not after GitHub's 6 hours (#428)
    # The suite in two halves on two runners, each with its own MariaDB: the test step is CPU-bound PHP (a faster server
    # saved ~3%, more processes than the runner's 4 cores slowed it), and on an AMD EPYC 7763 runner it alone took 15
    # minutes (#603). Both halves run to the end: one failing does not cancel the other's failures.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        mariadb: ['10.11']   # same as the devbox
        shard: [1, 2]
    
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mycs_test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # The schema is loaded from database/schema/mariadb-schema.sql by the mariadb client (the migrations squashed).
      - name: MariaDB client
        # A newer client asks for TLS by default, and the service container serves none (2026-11-06: «SSL is required,
        # but the server does not support it» when the schema is loaded): plain TCP to the local container.
        #
        # When apt cannot reach its mirrors (2026-11-11: the runner could not resolve Ubuntu's archive hosts for hours,
        # and every MariaDB job died here before a single test), the client of the service container itself is used:
        # same version as the server, reached with docker exec, nothing to download.
        run: |
          if true; then  # TEMPORARY: force the fallback once to prove it; reverted in the next commit
            echo "::warning::apt could not install mariadb-client: using the service container's own client"
            # Under both names: the framework's schema loader calls one or the other, depending on its version.
            printf '#!/bin/sh\nexec docker exec -i %s mariadb "$@"\n' "${{ job.services.mariadb.id }}" | sudo tee /usr/local/bin/mariadb /usr/local/bin/mysql > /dev/null
            sudo chmod +x /usr/local/bin/mariadb /usr/local/bin/mysql
          fi
          printf '[client]\nskip-ssl\n' > ~/.my.cnf
          mariadb --version

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
        
      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Build Assets
        run: |
          npm install
          npm run build

      - name: Run Tests
        env:
          DB_CONNECTION: mariadb   # like the devbox; the mysql driver asks for utf8mb4_0900_ai_ci, which MariaDB 10.11 lacks
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mycs_test
          DB_USERNAME: root
          DB_PASSWORD: password
        # ParaTest's sequential split: the sorted tests cut in two by count, then run file by file (a file astride the cut runs
        # in both halves, so nothing is left out). One database per process (CLAUDE.md, «Tests»).
        run: php artisan test --parallel --shard=${{ matrix.shard }}/2