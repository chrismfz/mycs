name: Test 

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hung test fails the job, not after GitHub's 6 hours (#428)
    strategy:
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Create Database
        run: touch database/database.sqlite

      # The schema is loaded from database/schema/sqlite-schema.sql by the sqlite3 client (the migrations squashed).
      - name: SQLite client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends sqlite3
      
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
        
      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Build Assets
        run: |
          npm install
          npm run build

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test --parallel   # one database per process (CLAUDE.md, «Tests»)

  test-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hung test fails the job, not after GitHub's 6 hours (#428)
    strategy:
      matrix:
        php: ['8.4']
        mariadb: ['10.11']   # same as the devbox
        tuned: [false, true]          # EXPERIMENT, removed before merge
        jit: [false, true]            # EXPERIMENT, removed before merge
        rep: [1, 2]                   # EXPERIMENT, removed before merge
        exclude:
          - { tuned: false, jit: true }
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
          ini-values: ${{ matrix.jit && 'opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M' || '' }}

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # The schema is loaded from database/schema/mariadb-schema.sql by the mariadb client (the migrations squashed).
      - name: MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mariadb-client

      # EXPERIMENT: tuned = durability off on tmpfs; not tuned = what the service container ran.
      - name: Start MariaDB
        run: |
          if [ "${{ matrix.tuned }}" = true ]; then
            storage="--tmpfs /var/lib/mysql:rw"
            args="--innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0 --skip-log-bin --sync-binlog=0 --innodb-buffer-pool-size=2G"
          else
            storage=""; args=""
          fi
          docker run -d --name mariadb -p 3306:3306 $storage \
            -e MARIADB_ROOT_PASSWORD=password -e MARIADB_DATABASE=mycs_test \
            --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=2s --health-timeout=5s --health-retries=30 \
            mariadb:${{ matrix.mariadb }} $args
          for i in $(seq 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mariadb)" = healthy ] && break
            sleep 1
          done
          docker logs mariadb 2>&1 | tail -20
          [ "$(docker inspect -f '{{.State.Health.Status}}' mariadb)" = healthy ]
          mariadb -h127.0.0.1 -uroot -ppassword -e "SELECT VERSION(); SHOW VARIABLES WHERE Variable_name IN ('innodb_flush_log_at_trx_commit','innodb_doublewrite','log_bin','sync_binlog','innodb_buffer_pool_size','innodb_flush_method','datadir')"

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
        
      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Build Assets
        run: |
          npm install
          npm run build

      - name: Run Tests
        env:
          DB_CONNECTION: mariadb   # like the devbox; the mysql driver asks for utf8mb4_0900_ai_ci, which MariaDB 10.11 lacks
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mycs_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php -i | grep -E '^opcache.(enable_cli|jit) ' ; php artisan test --parallel --log-junit=junit.xml   # one database per process (CLAUDE.md, «Tests»)

      - name: EXPERIMENT upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.tuned }}-${{ matrix.jit }}-${{ matrix.rep }}
          path: junit.xml
