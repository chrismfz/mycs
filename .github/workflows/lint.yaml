name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Pint (check only)
        run: vendor/bin/pint --test

      - name: Prepare .env (larastan boots the app and needs an APP_KEY)
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env

      - name: PHPStan (new errors only, see phpstan-baseline.neon)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      # The locked versions against the advisories (no install needed): a known hole fails the PR.
      - name: Composer audit
        run: composer audit --locked --no-interaction --abandoned=report

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # What reaches the browser; the build tools only run on our machines.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate
